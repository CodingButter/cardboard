name: Deploy docs

on:
  push:
    branches: [main]
    # The docs site stages the editor + game via prebuild scripts
    # (stage:editor / stage:game). So changes to any of these surfaces
    # need to trigger a redeploy. This workflow is the SOLE Pages
    # deploy now that deploy-editor.yml has been retired in favor of
    # the unified docs+editor+game pipeline.
    paths:
      - 'docs/**'
      - 'apps/docs/**'
      - 'apps/editor/**'
      - 'apps/game/**'
      - 'apps/pack-builder/**'
      - 'apps/game/public/packs/**'
      - 'packs/**'
      - 'packages/**'
      - 'scripts/sync-plans.ts'
      - 'scripts/gen-api-docs.ts'
      - 'scripts/build-game-for-docs.ts'
      - 'scripts/build-editor-for-docs.ts'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deploy at a time. We don't cancel in-progress deploys —
# letting them finish keeps history readable.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build docs
        run: bun run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
