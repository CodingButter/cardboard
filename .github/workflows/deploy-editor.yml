# Build and deploy the editor + flattened game runner to GitHub Pages.
#
# Base URL strategy: bun build already emits asset hrefs as relative
# (`./index-XXXX.js`), so no `--public-path` is needed. Runtime base
# detection in `apps/editor/src/lib/assetUrl.ts` picks up the
# `/cardboard/` subpath from `location.pathname` and prefixes all
# editor-side absolute asset URLs (e.g. `/packs/Cardboard.apg`). The
# game's engine code hardcodes `/packs/Cardboard.apg` — out of scope
# to edit — so the `flatten` step below rewrites that string to
# `./packs/...` in the built game bundle so it resolves relative to
# the iframe document (`/cardboard/play/index.html` →
# `/cardboard/play/packs/Cardboard.apg`).
#
# Conflict with .github/workflows/docs.yml: both target GitHub Pages
# (single deployment slot per repo). The `concurrency: pages` group
# below is shared with docs.yml so they queue rather than collide.
# If both should be deployable, they need to be merged into a single
# multi-app pipeline; for now the most recent push wins.
name: Deploy editor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build + flatten deploy tree
        # build:pages does everything: builds game + editor
        # programmatically via Bun.build (loading bun-plugin-tailwind
        # so the CSS is fully compiled — `bun build` CLI doesn't pick
        # up the [serve.static] plugins from bunfig.toml, which is
        # what produced the all-styles-broken first deploy), copies
        # editor public/, game dist → editor/dist/play, game packs →
        # both editor/dist/packs + editor/dist/play/packs, and the
        # game's root statics (manifest + icons + images) under play/.
        # Final step rewrites root-absolute /packs/ etc. to relative.
        run: bun run --cwd apps/editor build:pages

      - name: Sanity report
        run: |
          echo "--- deploy tree summary ---"
          ls apps/editor/dist | head -20
          echo "--- play/ ---"
          ls apps/editor/dist/play | head -20
          echo "--- packs/ ---"
          ls apps/editor/dist/packs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/editor/dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
