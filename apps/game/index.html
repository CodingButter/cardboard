<!-- index.html -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Browser Doom</title>
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="two_5_d" />
    <!--
      The manifest + icon links are injected at runtime instead of being
      declared as `<link>` here.  Bun's HTML bundler tries to resolve
      every `href` it sees, and these point at root-relative public
      assets it doesn't know about at build time — which would make
      `bun build` fail.  Injecting them keeps the bundler happy while
      still making the page installable as a PWA (browsers parse
      dynamically-added link tags for both manifest and icons).
    -->
    <script>
      (function () {
        var head = document.head;
        function add(rel, href, extra) {
          var l = document.createElement("link");
          l.rel = rel;
          l.href = href;
          if (extra) for (var k in extra) l.setAttribute(k, extra[k]);
          head.appendChild(l);
        }
        add("manifest", "/manifest.webmanifest");
        add("icon", "/icons/icon-192.png", { type: "image/png", sizes: "192x192" });
        add("icon", "/icons/icon-512.png", { type: "image/png", sizes: "512x512" });
        add("apple-touch-icon", "/icons/icon-512.png");
      })();
    </script>
    <link href="./index.css" rel="stylesheet" />
    <script src="./index.ts" type="module" defer></script>
  </head>
  <body>
    <div
      id="root"
      class="bg-slate-300 p-0 w-screen h-screen overflow-hidden flex justify-center items-center text-white text-2xl"
    >
      <canvas
        id="main-canvas"
        class="block bg-slate-500 max-w-full max-h-full rounded-md shadow-lg"
      ></canvas>
    </div>
    <!-- Boot-time loading overlay. main.ts updates the status line as
         the pack downloads, decodes, and the scene loads, then removes
         the overlay just before the first frame. The styles are inline
         so they apply before the JS bundle (which carries Tailwind) has
         parsed. -->
    <div
      id="boot-loading"
      style="
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #0f172a; color: #e2e8f0;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        gap: 1.25rem;
      "
    >
      <div
        style="
          width: 56px; height: 56px;
          border: 4px solid #334155; border-top-color: #38bdf8;
          border-radius: 999px;
          animation: boot-spin 0.9s linear infinite;
        "
      ></div>
      <div id="boot-loading-status" style="font-size: 1rem; opacity: 0.8;">
        Loading…
      </div>
      <style>
        @keyframes boot-spin { to { transform: rotate(360deg); } }
      </style>
    </div>
  </body>
</html>
